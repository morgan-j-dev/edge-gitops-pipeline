# ====================================================================================
# AKAMAI MAPPING REFERENCE: GitOps CI/CD Automation Pipeline & Jira State Tracking
# ====================================================================================
# This continuous deployment engine automates staging validation and production releases.
# In an enterprise workflow, this pipeline intercepts the Git Branch or Pull Request key 
# (e.g., JIRA-104) to append 'terraform plan' outputs directly onto corresponding 
# Jira Change Requests and pushes deployment metadata straight into Confluence spaces.
# ====================================================================================

name: "Edge Infrastructure Deployment Pipeline"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write # Required for publishing plan comments onto code review boards

jobs:
  terraform_pipeline:
    name: "Validate & Apply Edge Infrastructure"
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: "1. Checkout Source Code Repository"
        uses: actions/checkout@v4

      - name: "2. Install & Configure Terraform Runtime Engine"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: "3. Execute Code Formatting Verification"
        run: terraform fmt -check

      - name: "4. Initialize Backend Provider Ecosystem"
        run: terraform init
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: "5. Validate Code Syntactical Authenticity"
        run: terraform validate

      - name: "6. Generate Infrastructure Change Execution Plan"
        id: plan
        if: github.event_name == 'pull_request'
        # Corresponds to compiling Akamai property snippets and running local staging verification
        run: terraform plan -no-color -input=false
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}

      - name: "7. Publish Change Execution Plan Log to Code Review Panel & Jira Webhook"
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const output = `#### Akamai-Mapped GitOps Plan Log Summary 📝
            * **Validation Result:** Success ✅
            * **Change Management Action:** Review edge infrastructure changes below before approving main release branch.
            
            \`\`\`hcl
            ${process.env.TERRAFORM_PLAN_OUTPUT}
            \`\`\``;
            
            github.rest.issues.createComment({
              issue_number: context.issue_number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })
        env:
          TERRAFORM_PLAN_OUTPUT: ${{ steps.plan.outputs.stdout }}

      - name: "8. Commit & Execute Infrastructure Changes to Live Production Network Edge"
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        # Corresponds directly to activating an Akamai property configuration on the Production network layer
        run: terraform apply -auto-approve -input=false
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}

